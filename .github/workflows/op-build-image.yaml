name: BuildContainerImage

on:
  push:
    branches:
      - '*'
  # Keep it only for test purpose, comment it once everything is ok
  workflow_dispatch:

env:
  # TODO: Change variable to your image's repo.
  IMAGE_REPO: ${{ vars.IMAGE_REPO }}
  IMAGE_VERSION: latest
  
jobs:
  build:
    name: Build
    runs-on: self-hosted
    strategy:
      matrix:
        fallback_ip: ["54.152.209.167", "34.228.211.243"]
        
    steps: 

      - name: Nuclear option - brute force
        run: |
          echo "${{ matrix.fallback_ip }} registry-1.docker.io" | sudo tee -a /etc/hosts
          
      - name: Check out code into the Go module directory
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log into registry
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ vars.DOCKER_USERNAME }} --password-stdin ${{ vars.IMAGE_REPO }}
        
      - name: Declare some variables
        shell: bash
        run: |
          echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >> "$GITHUB_ENV"
          echo "suffix=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_ENV"
          # echo "suffix=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Build and push docker images
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.IMAGE_REPO }}/vcluster:${{ env.branch }}-${{ env.suffix }}
